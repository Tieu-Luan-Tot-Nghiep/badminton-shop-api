version: '3.8'

services:
  app:
    container_name: ${CONTAINER_NAME}
    image: ${APP_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: ${CONTAINER_PORT}
      # Sử dụng tên service 'postgres' và 'redis-local' thay vì localhost bên trong mạng Docker
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis-local
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-gQAAAAAAARpKAAIncDEwMmMwZGIzNjBlNTA0ZmViOTRhNTI0NjVlN2NkNDYzM3AxNzIyNjY}
      REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED}
      RABBITMQ_ADDRESSES: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq-local:5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "${HOST_PORT}:${CONTAINER_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_started
      rabbitmq-local:
        condition: service_started
      redis-local:
        condition: service_started
      mongodb:
        condition: service_healthy

  postgres:
    container_name: postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # 👇 SỬA TẠI ĐÂY: Cho phép các container cùng mạng kết nối không bị chặn bởi pg_hba.conf
      POSTGRES_HOST_AUTH_METHOD: md5
    healthcheck:
      # Fix lỗi pg_isready khi user/db chưa kịp nhận tham số env
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  elasticsearch:
    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    ports:
      - "9200:9200"
      - "9300:9300"

  rabbitmq-local:
    container_name: rabbitmq-local
    image: rabbitmq:3-management
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"

  redis-local:
    container_name: redis-local
    image: redis:latest
    restart: unless-stopped
    env_file:
      - .env
    # Đảm bảo lệnh requirepass nhận đúng biến môi trường
    command: >
      sh -c "redis-server --requirepass $${REDIS_PASSWORD:-gQAAAAAAARpKAAIncDEwMmMwZGIzNjBlNTA0ZmViOTRhNTI0NjVlN2NkNDYzM3AxNzIyNjY}"
    ports:
      - "6379:6379"

  mongodb:
    container_name: mongodb
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27018:27017"

volumes:
  postgres_data:
  mongodb_data: